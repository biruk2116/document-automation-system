<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doc Automation logo">
  <defs>
    <linearGradient id="da-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- self-contained rounded badge: carries its own background, so it reads
       cleanly on the dark sidebar, a light favicon tab, or anywhere else -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#da-bg)"/>

  <!-- document sheet -->
  <path d="M24 16H34.5L41 22.5V44C41 45.66 39.66 47 38 47H24C22.34 47 21 45.66 21 44V19C21 17.34 22.34 16 24 16Z"
        fill="#FFFFFF"/>
  <path d="M34.5 16L41 22.5H36.5C35.4 22.5 34.5 21.6 34.5 20.5V16Z" fill="#BFDBFE"/>

  <!-- content lines -->
  <rect x="25" y="28" width="12" height="2.6" rx="1.3" fill="#2563EB"/>
  <rect x="25" y="33.4" width="12" height="2.6" rx="1.3" fill="#2563EB"/>
  <rect x="25" y="38.8" width="8" height="2.6" rx="1.3" fill="#93C5FD"/>

  <!-- automation badge: circular arrow, overlapping the sheet's bottom-right
       corner, in the teal accent so it pops against both the blue badge and
       the white sheet -->
  <circle cx="43" cy="43" r="11" fill="#22D3B5" stroke="#FFFFFF" stroke-width="2.4"/>
  <path d="M38.3 43C38.3 40.1 40.6 37.8 43.5 37.8C45.5 37.8 47.2 38.9 48.1 40.5"
        stroke="#0B3B33" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M48.5 37.6V41H45.1" stroke="#0B3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M48.7 43C48.7 45.9 46.4 48.2 43.5 48.2C41.5 48.2 39.8 47.1 38.9 45.5"
        stroke="#0B3B33" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M38.5 48.4V45H41.9" stroke="#0B3B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
