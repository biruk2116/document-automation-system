<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Automation System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/brand-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand-logo.png" />
    <link rel="apple-touch-icon" href="/brand-logo.png" />
    <meta name="application-name" content="Document Automation System" />
    <meta name="description" content="Document Automation System — generate, approve, deliver and verify documents securely." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Apply saved theme before React hydrates to avoid flash of wrong colour -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('doc-automation-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
